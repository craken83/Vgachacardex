const { useState, useMemo, useEffect, useRef, useCallback, useDeferredValue, memo } = React;

// Retire les préfixes de rareté des noms de cartes
// ("UR-Ankorisu -Ayako-" -> "Ankorisu -Ayako-")
const stripRarityPrefix = (n) =>
  n.replace(/^(SSR|SR|UR2|UR|SEC2|SEC|ZEVENT|SPOOKY)-/i, "").trim();
// Clé de fusion : sans préfixe, minuscules, "_" traité comme espace
// ("SR-Yami_Shin" et "SSR-Yami Shin" -> "yami shin" = même personne)
const normKey = (n) => stripRarityPrefix(n).toLowerCase().replace(/_/g, " ");

// ===== FICHIER DE PROGRESSION (sauvegarde externe) =====
let linkedHandle = null; // fichier lié (File System Access API, Chrome/Edge)
const writeLinked = async (s) => {
  if (!linkedHandle) return;
  try {
    const w = await linkedHandle.createWritable();
    await w.write(toProgressFile(s));
    await w.close();
  } catch (e) {}
};
// Fusionne deux états sans rien perdre (union des numéros)
const mergeStates = (a, b) => {
  const out = { ...a };
  Object.entries(b || {}).forEach(([card, secs]) => {
    const cur = { ...(out[card] || {}) };
    Object.entries(secs || {}).forEach(([sec, nums]) => {
      if (!Array.isArray(nums) || !nums.length) return;
      cur[sec] = [...new Set([...(cur[sec] || []), ...nums])].sort((x, y) => x - y);
    });
    if (Object.keys(cur).length) out[card] = cur;
  });
  return out;
};
const PROGRESS_PREFIX = /^\s*window\.VGACHA_PROGRESSION\s*=\s*/;
const parseProgress = (text) => JSON.parse(text.replace(PROGRESS_PREFIX, "").replace(/;\s*$/, ""));
const toProgressFile = (s) => "window.VGACHA_PROGRESSION = " + JSON.stringify(s, null, 1) + ";\n";
function loadState() {
  // 1) le navigateur (localStorage) ; 2) à défaut, vgacha-progression.js
  try {
    const raw = localStorage.getItem("vgacha-tags-toutes-les-cartes");
    if (raw) {
      const s = migrateState(JSON.parse(raw));
      if (Object.keys(s).length) return s;
    }
  } catch (e) {}
  try {
    if (window.VGACHA_PROGRESSION) return migrateState(window.VGACHA_PROGRESSION);
  } catch (e) {}
  return {};
}
function migrateState(saved) {
  try {
    // MIGRATION : fusionne les clés (préfixées ou non) dans la carte fusionnée
    // (nom sans préfixe), en respectant le nom d'affichage exact.
    // Les numéros sont cumulés sans doublon.
    const migrated = {};
    const target = (key) => {
      if (typeof DISPLAY_BY_NORM !== "undefined") {
        const display = DISPLAY_BY_NORM.get(normKey(key));
        if (display) return display;
      }
      return stripRarityPrefix(key);
    };
    Object.entries(saved).forEach(([key, val]) => {
      const canon = target(key);
      if (!migrated[canon]) migrated[canon] = {};
      Object.entries(val || {}).forEach(([cadre, nums]) => {
        if (!Array.isArray(nums) || nums.length === 0) return;
        // Les anciennes raretés ZEVENT deviennent des séries :
        // leurs numéros migrent vers les sections correspondantes.
        let dest = cadre;
        if (cadre === "R:ZEVENT") dest = "Zevent";
        else if (cadre === "R:Fullart") dest = "Fullart";
        const prev = migrated[canon][dest] || [];
        migrated[canon][dest] = [...new Set([...prev, ...nums])].sort((a, b) => a - b);
      });
    });
    return migrated;
  } catch (e) { return {}; }
}

function saveState(s) {
  try {
    localStorage.setItem("vgacha-tags-toutes-les-cartes", JSON.stringify(s));
  } catch (e) {}
}

// Index normalisés pré-calculés : évite de reparcourir les listes à chaque rendu.
const FULLART_KEYS = new Set((FILTRES["Fullart"] || []).map(normKey));
const isFullartCard = (name) => FULLART_KEYS.has(normKey(name));

// ===== FILTRES PAR SÉRIE =====
// D'après vgacha-db.js : une const FILTRES { "Nom de série": [cartes] }.
// Une carte peut être dans plusieurs listes. Les séries emoji restent
// "à identifier" et gardent leur emoji comme libellé de filtre.

const SERIES_ORDER_INDEX = new Map(SERIES_ORDER.map((label, index) => [label, index]));
const HIDDEN_SERIES_BUTTONS = new Set(["Base", "Saint-Valentin"]);
// Raretés traitées comme SÉRIES (pas de chip Rareté pour elles) :
// ZEVENT devient "Zevent". (Fullart est une série normale,
// définie uniquement dans FILTRES comme Fluff Event, Maid, etc.)
const SERIES_FROM_RARITY = { "ZEVENT": "Zevent" };

// ===== COLLECTIONS SUPPLÉMENTAIRES (popup + lignes des cartes) =====
// Elles s'ajoutent aux CADRES classiques (Basique, Bêta, Shiny, Dark, Rainbow,
// VTA25, St-Valentin, Fullart) partout : popup Pokecardex + compteurs des cartes.
// "count" = nombre de numéros possibles pour cette collection.
// Tu me donneras les correspondances exactes : ajuste les noms/count ici.

// Toutes les sections affichées (cadres classiques + collections supplémentaires)

// Nombre de numéros possibles pour une section
const EXTRA_SECTION_COUNTS = new Map(EXTRA_SECTIONS.map(({ name, count }) => [name, count]));
const sectionCount = (name) =>
  VARIANTES_COUNT[name] !== undefined
    ? VARIANTES_COUNT[name]
    : EXTRA_SECTION_COUNTS.get(name) || 1;

// ===== CARTES ÉLIGIBLES PAR COLLECTION =====
// Comme FILTRES["Fullart"] : ces collections n'existent que pour les cartes listées.
// Pour les autres cartes, la section affiche "—".
const SECTION_CARDS_FALLBACK = {

  ],

  ],

  ],

  ],

  ],

  ],

    "Okamiartfurry", "PokeFey_", "Ponoki", "Shinya_nia", "Sillica", "TakuDev",
    "UnePlanteEnPot", "Volpoune", "Wicked Fox", "Yhusky", "Yuka Portesonges",

    "SPOOKY-Micku", "SPOOKY-Nimilith", "SPOOKY-Ookaman", "SPOOKY-Pinkaiii",
    "SPOOKY-RomanyHunh", "SPOOKY-Shao_pix", "SPOOKY-Sheiyah Sorai", "SPOOKY-Skirona",
    "SPOOKY-Sol_Hms", "SPOOKY-Ashley Plateada", "SPOOKY-Hana Momiji", "SPOOKY-Miel Crapouille",
    "SPOOKY-Ryushi", "SPOOKY-Ames", "SPOOKY-Ankorisu -Ayako-", "SPOOKY-Chose Crevette",
    "SPOOKY-Kamiye", "SPOOKY-Hiwamari", "SPOOKY-Manaryuujin", "SPOOKY-Pawa",
    "SPOOKY-Misterlapino", "SPOOKY-Rosalice", "SPOOKY-Sodalithe", "SPOOKY-stinkycatsy",
    "SPOOKY-Noryah", "SPOOKY-Nishibi", "SPOOKY-Shiho Litchi"
  ]
};
// Les sections viennent de vgacha-db.js (SECTIONS_DB, éditable dans vgacha-admin.html) ; la liste ci-dessus sert de secours.
const SECTION_CARDS = (typeof SECTIONS_DB !== "undefined") ? SECTIONS_DB : SECTION_CARDS_FALLBACK;
// Une section s'affiche pour cette carte si elle n'a pas de liste restreinte
// (ou si la carte en fait partie) — comparaison normalisée (sans préfixe,
// minuscules, "_" = espace) pour tenir compte de la fusion des versions
const SECTION_CARD_KEYS = Object.fromEntries(
  Object.entries(SECTION_CARDS).map(([section, names]) => [section, new Set(names.map(normKey))])
);
const sectionApplies = (section, cardName) => {
  const allowed = SECTION_CARD_KEYS[section];
  return !allowed || allowed.has(normKey(cardName));
};

// ===== SECTIONS PORTANT LES NUMÉROS D'UNE SÉRIE =====
// Pour savoir si une carte a "au moins un numéro dans la série X", on regarde
// les sections qui portent les numéros de cette série. Par défaut : la série
// elle-même + sa déclinaison "Signed …".
const SERIES_SECTIONS = {
  "Base": ["Basique", "Bêta", "Shiny", "Dark", "Rainbow"],
  "VTA 2025": ["VTA25"],
  "Saint-Valentin": ["St-Valentin"],
  "Zevent": ["Zevent"],
  "Fluff Event 2026": ["Fluff Event 2026"],
  "Spooky": ["Spooky"]
};
const seriesSections = (label) => SERIES_SECTIONS[label] || [label, "Signed " + label];

// ===== LISTE UNIFIÉE (une seule "db") =====
// Toutes les versions d'une même carte (ex. "Ankorisu -Ayako-", "UR-Ankorisu
// -Ayako-", "SEC-Ankorisu -Ayako-") sont regroupées en UNE seule carte qui
// cumule ses tags de rareté. Les préfixes UR-, SEC-, SSR-, SR-, UR2-, SEC2-,
// ZEVENT- sont retirés du pseudo et transformés en tag.
// ZEVENT devient une SÉRIE (pas une rareté) : ses
// cartes sont ajoutées au chip Série correspondant,
// fusionnées avec les cartes qui y étaient déjà via leur code de série.
const ALL_CARDS = (() => {
  const map = new Map(); // clé = pseudo normalisé (sans préfixe, minuscules, _ = espace)
  // Index inverse série -> noms normalisés, construit une seule fois.
  const seriesByKey = new Map();
  Object.entries(FILTRES).forEach(([label, names]) => names.forEach(name => {
    const key = normKey(name);
    if (!seriesByKey.has(key)) seriesByKey.set(key, []);
    seriesByKey.get(key).push(label);
  }));
  GROUPS.forEach(g => g.cards.forEach(n => {
    const canon = stripRarityPrefix(n);
    const key = normKey(canon);
    let e = map.get(key);
    if (!e) {
      e = { name: canon, lower: canon.toLowerCase(), series: [], rarities: [] };
      map.set(key, e);
    }
    // Séries récupérées directement depuis l'index pré-calculé.
    (seriesByKey.get(key) || []).forEach(label => {
      if (!e.series.includes(label)) e.series.push(label);
    });
    // ZEVENT = série, pas rareté
    const asSeries = SERIES_FROM_RARITY[g.key];
    if (asSeries) {
      if (!e.series.includes(asSeries)) e.series.push(asSeries);
    } else if (!e.rarities.includes(g.key)) {
      e.rarities.push(g.key);
    }
  }));
  return [...map.values()].map(e => {
    // Une carte qui n'est dans aucune liste de série (ex. anciens emojis "?")
    // est classée en "Base"
    if (e.series.length === 0) e.series.push("Base");
    // Raretés affichées dans les lignes / popup (hors "Base") : pré-calculé
    // une seule fois au lieu d'un .filter() à chaque rendu.
    // AFFICHAGE DES RARETÉS DÉSACTIVÉ : tableau vide = plus de lignes de rareté
    // sur les cartes ni de sections rareté dans la popup.
    e.displayRarities = [];
    // Séries affichées sur la carte (hors "Base" implicite) : pré-calculé.
    e.displaySeries = e.series.filter(s => s !== "Base");
    return e;
  })
  // Affichage des cartes en ordre alphabétique (insensible à la casse / accents)
  .sort((a, b) => a.name.localeCompare(b.name, "fr", { sensitivity: "base" }));
})();
// nom normalisé -> nom d'affichage exact (pour la migration des anciennes clés)
const DISPLAY_BY_NORM = new Map(ALL_CARDS.map(c => [normKey(c.name), c.name]));
const CARD_BY_NORM = new Map(ALL_CARDS.map(c => [normKey(c.name), c]));
// Couleurs des tags de rareté
const RARITY_COLORS = {
  "Base": "bg-slate-700 text-slate-200",
  "SR": "bg-blue-900/70 text-blue-300",
  "SSR": "bg-purple-900/70 text-purple-300",
  "UR": "bg-amber-900/70 text-amber-300",
  "UR2": "bg-orange-900/70 text-orange-300",
  "SEC": "bg-rose-900/70 text-rose-300",
  "SEC2": "bg-pink-900/70 text-pink-300",
  "ZEVENT": "bg-yellow-900/70 text-yellow-300"
};
// Bordures (hex) des sections de rareté dans la popup
const RARITY_BORDER = {
  "Base": "#64748b", "SR": "#3b82f6", "SSR": "#a855f7", "UR": "#f59e0b",
  "UR2": "#fb923c", "SEC": "#f43f5e", "SEC2": "#ec4899",
  "ZEVENT": "#eab308"
};
// Nombre de numéros possibles par rareté dans la popup (1 par défaut)
const RARITY_COUNT = { "SR": 1, "SSR": 1, "UR": 1, "UR2": 1, "SEC": 1, "SEC2": 1, "ZEVENT": 1 };

// ===== HELPERS PERF =====
const EMPTY = {};
const PAGE = 60; // nombre de cartes rendues à la fois (chargement progressif)
const hasVariants = (cardState) => {
  if (!cardState) return false;
  for (const k in cardState) { const v = cardState[k]; if (Array.isArray(v) && v.length > 0) return true; }
  return false;
};
// Sections applicables à une carte + total : calculé une seule fois par carte.
const SECTIONS_CACHE = new Map();
const sectionsInfo = (cardName) => {
  let info = SECTIONS_CACHE.get(cardName);
  if (!info) {
    const sections = ALL_SECTIONS.filter(c =>
      !(c === "Fullart" && !isFullartCard(cardName)) && sectionApplies(c, cardName));
    info = { sections, total: sections.reduce((s, c) => s + sectionCount(c), 0) };
    SECTIONS_CACHE.set(cardName, info);
  }
  return info;
};
const countOwned = (st, sections) => {
  if (!st) return 0;
  let n = 0;
  for (const c of sections) if (st[c]) n += st[c].length;
  return n;
};

// ===== CARTE (mémoïsée : ne se re-rend que si SES données changent) =====
  // ===== CARTE =====
  // Chaque carte affiche, pour chaque cadre, "Cadre X/Y" (obtenues / total),
  // une mini barre de progression, les tags de numéros et un bouton +.
  const Card = memo(function Card({ r, own, onAdd, onRemove, onOpen }) {
    const { sections, total } = sectionsInfo(r.name);
    const owned = countOwned(own, sections);
    const pct = total > 0 ? Math.round(owned / total * 100) : 0;
    const complete = owned === total && total > 0;
    return (
      <div key={r.name}
        className={`rounded-xl border p-4 flex flex-col transition ${
          complete
            ? "border-emerald-500/60 bg-emerald-950/20"
            : hasVariants(own)
              ? "border-slate-700 bg-slate-900"
              : "border-slate-800 bg-slate-900/60"
        }`}>
        {/* En-tête : pseudo cliquable + chips de série */}
        <div className="flex items-start justify-between gap-2 mb-1">
          <button onClick={() => onOpen(r.name)}
            className="font-bold text-indigo-300 hover:text-indigo-100 hover:underline cursor-pointer text-left">
            {r.name}
          </button>
        </div>

        {/* Chips des séries de la carte (pré-calculées dans displaySeries) */}
        {r.displaySeries.length > 0 && (
          <div className="flex flex-wrap gap-1 mb-2">
            {r.displaySeries.map(s => (
              <span key={s}
                className="px-1.5 py-0.5 text-[10px] rounded-full bg-slate-800 text-slate-300 border border-slate-600">
                {s}
              </span>
            ))}
          </div>
        )}

        {/* Progression globale de la carte */}
        <div className="mb-3">
          <div className="flex justify-between text-xs mb-1">
            <span className={complete ? "text-emerald-400 font-semibold" : "text-slate-400"}>
              {owned}/{total} ({pct}%)
            </span>
            {complete && <span className="text-emerald-400 font-semibold">Complète !</span>}
          </div>
          <div className="h-1.5 rounded-full bg-slate-800 overflow-hidden">
            <div className="h-full rounded-full bg-gradient-to-r from-indigo-500 to-cyan-400 transition-all"
              style={{ width: pct + "%" }}></div>
          </div>
        </div>

        {/* Une ligne par section (cadres puis raretés) : "Basique 10/137" + barre + boutons.
            Boucle unique : cadres et raretés partagent le même markup (perf + code réduit). */}
        <div className="space-y-1.5">
          {[
            ...sections.map(c => ({ key: c, label: c, max: sectionCount(c), color: CADRE_BORDER[c] || "#6366f1" })),
            ...r.displayRarities.map(rr => ({ key: "R:" + rr, label: rr, max: RARITY_COUNT[rr] || 1, color: RARITY_BORDER[rr] || "#6366f1" }))
          ].map(({ key, label, max, color }) => {
            const count = own[key] ? own[key].length : 0; // déjà trié à l'écriture : pas de slice().sort()
            const done = count === max;
            const pct = Math.round(count / max * 100);
            return (
              <div key={key} className="flex items-center gap-2">
                {/* Pastille de la section */}
                <span className="w-2 h-2 rounded-full shrink-0" style={{ background: color }}></span>
                {/* Nom + compteur obtenues/total */}
                <span className="text-xs w-28 shrink-0 flex items-baseline gap-1">
                  <span className="text-slate-300 font-medium">{label}</span>
                  <span className={done ? "text-emerald-400 font-bold" : "text-slate-400"}>
                    {count}/{max}
                  </span>
                </span>
                {/* Mini barre de progression */}
                <span className="h-1 rounded-full bg-slate-800 overflow-hidden grow" style={{ minWidth: 24 }}>
                  <span className="block h-full rounded-full" style={{ width: pct + "%", background: color }}></span>
                </span>
                <span className="flex flex-wrap gap-1 justify-end">
                  {count > 0 && (
                    <button onClick={() => onRemove(r.name, key)}
                      title="Retirer un numéro"
                      className="px-1.5 py-0.5 text-[10px] bg-slate-700 hover:bg-red-700 rounded-full">&minus;</button>
                  )}
                  {count < max && (
                    <button onClick={() => onAdd(r.name, key)}
                      title="Ajouter un numéro"
                      className="px-1.5 py-0.5 text-[10px] bg-slate-700 hover:bg-slate-600 rounded-full">+</button>
                  )}
                </span>
              </div>
            );
          })}
        </div>
      </div>
    );
  });

function Collection() {
  const [rarityFilter, setRarityFilter] = useState(null); // rareté filtrée (null = toutes)
  const [search, setSearch] = useState("");
  const [serieFilter, setSerieFilter] = useState(null); // série filtrée (null = toutes)
  const [showOnlyOwned, setShowOnlyOwned] = useState(false); // masquer les cartes vierges
  const [state, setState] = useState(loadState);
  const [pokedexCard, setPokedexCard] = useState(null);
  const modalRef = useRef(null);

  const stateRef = useRef(state);
  stateRef.current = state;
  useEffect(() => {
    const t = setTimeout(() => { saveState(state); writeLinked(state); }, 300);
    return () => clearTimeout(t);
  }, [state]);
  useEffect(() => {
    const flush = () => saveState(stateRef.current);
    window.addEventListener("pagehide", flush);
    return () => window.removeEventListener("pagehide", flush);
  }, []);
  const dSearch = useDeferredValue(search); // frappe fluide dans la recherche
  const [limit, setLimit] = useState(PAGE);
  // Le sentinel est passé à setState en ref : l'observer n'est créé qu'une
  // seule fois par apparition du sentinel (et non à chaque page chargée).
  const [sentinel, setSentinel] = useState(null);

  useEffect(() => {
    document.body.style.overflow = pokedexCard ? "hidden" : "";
    return () => { document.body.style.overflow = ""; };
  }, [pokedexCard]);

  const closeModal = () => {
    if (modalRef.current) {
      document.body.removeChild(modalRef.current);
      modalRef.current = null;
    }
  };

  const toggleVariant = (card, cadre, number) => {
    setState(prev => {
      const cardData = prev[card] || {};
      const currentNumbers = cardData[cadre] || [];
      const nextNumbers = currentNumbers.includes(number)
        ? currentNumbers.filter(n => n !== number)
        : [...currentNumbers, number].sort((a, b) => a - b);
      const newCardData = { ...cardData };
      if (nextNumbers.length > 0) newCardData[cadre] = nextNumbers;
      else delete newCardData[cadre];
      return { ...prev, [card]: Object.keys(newCardData).length > 0 ? newCardData : undefined };
    });
  };


  const addCustomVariant = (card, cadre) => {
    closeModal();
    const max = sectionCount(cadre);
    const currentNumbers = [...(state[card]?.[cadre] || [])].sort((a, b) => a - b);
    const availableNumbers = [];
    for (let i = 1; i <= max; i++) {
      if (!currentNumbers.includes(i)) availableNumbers.push(i);
    }
    if (availableNumbers.length === 0) {
      alert(`Toutes les variantes (1-${max}) sont déjà cochées pour ${cadre}!`);
      return;
    }
    const modal = document.createElement('div');
    modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50";
    modal.innerHTML = `
      <div class="bg-slate-800 rounded-lg p-4 w-64 relative">
        <button class="absolute top-2 right-2 text-slate-400 hover:text-white text-xl">&times;</button>
        <h3 class="text-white mb-2">Ajouter ${cadre.replace(/^R:/, "")}</h3>
        <p class="text-xs text-slate-400 mb-2">Pour: ${card}</p>
        <select id="variant-select" class="w-full bg-slate-700 rounded p-2 mb-3">
          ${availableNumbers.map(num => `<option value="${num}">${num}</option>`).join('')}
        </select>
        <div class="flex gap-2">
          <button id="variant-confirm" class="bg-indigo-600 text-white px-3 py-1 rounded">Ajouter</button>
          <button id="variant-cancel" class="bg-slate-700 text-white px-3 py-1 rounded">Annuler</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    modalRef.current = modal;
    const confirmBtn = modal.querySelector('#variant-confirm');
    const cancelBtn = modal.querySelector('#variant-cancel');
    const closeBtn = modal.querySelector('button');
    confirmBtn.onclick = () => {
      const num = parseInt(modal.querySelector('#variant-select').value);
      if (!isNaN(num)) toggleVariant(card, cadre, num);
      closeModal();
    };
    cancelBtn.onclick = closeModal;
    closeBtn.onclick = closeModal;
    modal.onclick = (e) => { if (e.target === modal) closeModal(); };
  };

  const removeCustomVariant = (card, cadre) => {
    closeModal();
    const currentNumbers = [...(state[card]?.[cadre] || [])].sort((a, b) => a - b);
    if (currentNumbers.length === 0) return;
    if (currentNumbers.length === 1) { toggleVariant(card, cadre, currentNumbers[0]); return; }
    const modal = document.createElement('div');
    modal.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50";
    modal.innerHTML = `
      <div class="bg-slate-800 rounded-lg p-4 w-64 relative">
        <button class="absolute top-2 right-2 text-slate-400 hover:text-white text-xl">&times;</button>
        <h3 class="text-white mb-2">Retirer ${cadre.replace(/^R:/, "")}</h3>
        <p class="text-xs text-slate-400 mb-2">Pour: ${card}</p>
        <select id="variant-select" class="w-full bg-slate-700 rounded p-2 mb-3">
          ${currentNumbers.map(num => `<option value="${num}">${num}</option>`).join('')}
        </select>
        <div class="flex gap-2">
          <button id="variant-confirm" class="bg-red-600 text-white px-3 py-1 rounded">Retirer</button>
          <button id="variant-cancel" class="bg-slate-700 text-white px-3 py-1 rounded">Annuler</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    modalRef.current = modal;
    modal.querySelector('#variant-confirm').onclick = () => {
      const num = parseInt(modal.querySelector('#variant-select').value);
      if (!isNaN(num)) toggleVariant(card, cadre, num);
      closeModal();
    };
    modal.querySelector('#variant-cancel').onclick = closeModal;
    modal.querySelector('button').onclick = closeModal;
    modal.onclick = (e) => { if (e.target === modal) closeModal(); };
  };

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'Escape') { closeModal(); setPokedexCard(null); }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, []);

  // Noms des cartes possédées (recalculé uniquement quand state change)
  const ownedNames = useMemo(() => {
    const s = new Set();
    for (const k in state) if (hasVariants(state[k])) s.add(k);
    return s;
  }, [state]);

  // Compteur global des numéros de cartes (toutes cartes, toutes sections)
  // total = nombre de numéros possibles dans toute la collection
  // owned = numéros effectivement cochés
  const globalNumbers = useMemo(() => {
    let total = 0, owned = 0;
    ALL_CARDS.forEach(c => {
      const info = sectionsInfo(c.name);
      total += info.total;
      const st = state[c.name];
      if (st) for (const k in st) {
        const v = st[k];
        if (Array.isArray(v)) owned += v.length;
      }
    });
    return { total, owned };
  }, [state]);

  // Une carte a-t-elle au moins un numéro obtenu dans les sections d'une série ?
  const hasNumbersInSeries = useCallback((cardName, label) => {
    const st = state[cardName];
    if (!st) return false;
    return seriesSections(label).some(sec => Array.isArray(st[sec]) && st[sec].length > 0);
  }, [state]);

  // Liste filtrée : rareté + série + recherche + masquage des vierges.
  // Avec un filtre de série actif, "masquer les vierges" masque les cartes
  // n'ayant aucun numéro obtenu DANS CETTE SÉRIE (pas juste "vierges en tout").
  const ownedDep = showOnlyOwned ? ownedNames : null;
  const cards = useMemo(() => {
    const q = dSearch.trim().toLowerCase();
    return ALL_CARDS.filter(r => {
      if (q && !r.lower.includes(q)) return false;
      if (rarityFilter && !r.rarities.includes(rarityFilter)) return false;
      if (serieFilter && !r.series.includes(serieFilter)) return false;
      if (showOnlyOwned) {
        if (serieFilter) {
          if (!hasNumbersInSeries(r.name, serieFilter)) return false;
        } else if (!ownedNames.has(r.name)) return false;
      }
      return true;
    });
  }, [dSearch, rarityFilter, serieFilter, showOnlyOwned, ownedDep, hasNumbersInSeries]);

  // Chargement progressif : on repart de la 1re page quand les filtres changent
  useEffect(() => { setLimit(PAGE); }, [dSearch, rarityFilter, serieFilter, showOnlyOwned]);
  useEffect(() => {
    if (!sentinel) return;
    const io = new IntersectionObserver(es => {
      if (es[0].isIntersecting) setLimit(l => l + PAGE);
    }, { rootMargin: "800px" });
    io.observe(sentinel);
    return () => io.disconnect();
  }, [sentinel]);

  // Stats des chips de rareté (en tenant compte du filtre série actif)
  const rarityStats = useMemo(() => {
    const counts = new Map(); // rareté -> { total, owned }
    ALL_CARDS.forEach(c => {
      if (serieFilter && !c.series.includes(serieFilter)) return;
      const owned = ownedNames.has(c.name);
      c.rarities.forEach(key => {
        const item = counts.get(key) || { total: 0, owned: 0 };
        item.total++;
        if (owned) item.owned++;
        counts.set(key, item);
      });
    });
    const order = new Map(GROUPS.map((g, i) => [g.key, i]));
    return [...counts.entries()]
      .sort((a, b) => (order.get(a[0]) ?? Number.MAX_SAFE_INTEGER) - (order.get(b[0]) ?? Number.MAX_SAFE_INTEGER))
      .map(([key, value]) => ({ key, total: value.total, owned: value.owned }));
  }, [ownedNames, serieFilter]);

  // Stats des chips de série (en tenant compte du filtre rareté actif).
  // "owned" ne compte que les cartes ayant AU MOINS UN numéro obtenu
  // dans les sections de cette série (pas juste "quelque chose quelque part").
  const seriesStats = useMemo(() => {
    const counts = new Map(); // série -> { total, owned }
    ALL_CARDS.forEach(c => {
      if (rarityFilter && !c.rarities.includes(rarityFilter)) return;
      c.series.forEach(label => {
        const item = counts.get(label) || { total: 0, owned: 0 };
        item.total++;
        if (hasNumbersInSeries(c.name, label)) item.owned++;
        counts.set(label, item);
      });
    });
    return [...counts.entries()]
      // Masquer uniquement les boutons de ces séries, sans retirer leurs cartes ni leurs tags.
      .filter(([label]) => !HIDDEN_SERIES_BUTTONS.has(label))
      .sort((a, b) => (SERIES_ORDER_INDEX.get(a[0]) ?? SERIES_ORDER.length) - (SERIES_ORDER_INDEX.get(b[0]) ?? SERIES_ORDER.length))
      .map(([label, value]) => ({ label, total: value.total, owned: value.owned }));
  }, [hasNumbersInSeries, rarityFilter]);

  // Callbacks à identité stable (sinon React.memo ne servirait à rien)
  // (onToggle retiré : Card ne l'utilisait pas, la popup appelle toggleVariant directement)
  const addRef = useRef(); addRef.current = addCustomVariant;
  const onAdd = useCallback((...a) => addRef.current(...a), []);
  const removeRef = useRef(); removeRef.current = removeCustomVariant;
  const onRemove = useCallback((...a) => removeRef.current(...a), []);
  const onOpen = setPokedexCard;

  // ===== Fichier de progression : export / import / fichier lié =====
  const importRef = useRef(null);
  const [linked, setLinked] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const canLink = typeof window.showSaveFilePicker === "function";
  const exportProgress = () => {
    const blob = new Blob([toProgressFile(state)], { type: "text/javascript" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "vgacha-progression.js";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const closeMenu = () => setMenuOpen(false);
  const importProgress = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const imported = migrateState(parseProgress(await file.text()));
      setState(prev => mergeStates(prev, imported)); // fusion : rien n'est écrasé
    } catch (err) { alert("Fichier de progression invalide."); }
  };
  const linkFile = async () => {
    try {
      linkedHandle = await window.showSaveFilePicker({
        suggestedName: "vgacha-progression.js",
        types: [{ description: "Progression VGacha", accept: { "text/javascript": [".js"] } }]
      });
      setLinked(true);
      writeLinked(stateRef.current);
    } catch (err) {}
  };

  // Sections affichées pour une carte : cadres classiques + collections
  // supplémentaires, en respectant les listes d'éligibilité (Fullart et
  // SECTION_CARDS — comme Fullart, VTA25, Eikyuu Hours, GraVty, Signed Fullart)
  const cadresForCard = (cardName) => sectionsInfo(cardName).sections;
  const totalVariants = (cardName) => sectionsInfo(cardName).total;
  const ownedVariants = (cardName) => countOwned(state[cardName], sectionsInfo(cardName).sections);

  // ===== POPUP POKECARDEX =====
  // Infos (tags de rareté + séries) d'une carte fusionnée
  const cardInfo = (cardName) => CARD_BY_NORM.get(normKey(cardName)) || { rarities: [], displayRarities: [], series: [] };

  const renderPokecardex = (cardName) => {
    if (!cardName) return null;
    const cardState = state[cardName] || {};
    const info = cardInfo(cardName);
    const owned = ownedVariants(cardName);
    const total = totalVariants(cardName);
    const pct = total > 0 ? Math.round(owned / total * 100) : 0;
    return (
      <div className="fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm flex items-start justify-center z-50 overflow-y-auto p-4"
           onClick={(e) => { if (e.target === e.currentTarget) setPokedexCard(null); }}>
        <div className="bg-slate-800 rounded-xl border border-slate-700 w-full max-w-3xl my-8 p-5 relative shadow-2xl">
          <button onClick={() => setPokedexCard(null)}
            className="absolute top-3 right-3 text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
          <h2 className="text-xl font-bold text-white mb-2 flex flex-wrap items-center gap-2">
            Collection de <span className="text-indigo-400">{cardName}</span>
            {/* Tags de rareté (SR, SSR, UR, ZEVENT…) — affichage désactivé */}
            {false && info.rarities.map(rr => (
              <span key={rr}
                className={`px-2 py-0.5 text-[11px] font-semibold rounded-full border border-white/10 ${RARITY_COLORS[rr] || "bg-slate-700 text-slate-200"}`}>
                {rr}
              </span>
            ))}
          </h2>
          {/* Série(s) de la carte */}
          <div className="flex flex-wrap gap-1 mb-2">
            {info.series.map(s => (
              <span key={s} className="px-2 py-0.5 text-[11px] rounded-full bg-slate-800 text-slate-300 border border-slate-600">
                {s}
              </span>
            ))}
          </div>
          <p className="text-sm text-slate-400 mb-2">
            <span className="text-emerald-400 font-semibold">{owned}</span> / {total} cartes possédées ({pct}%)
          </p>
          <div className="h-2 rounded-full bg-slate-700 overflow-hidden mb-4">
            <div className="h-full bg-gradient-to-r from-indigo-500 to-cyan-400" style={{ width: pct + "%" }}></div>
          </div>
          <p className="text-xs text-slate-500 mb-3">Clique sur une carte pour l'ajouter / la retirer de ta collection.</p>

          {cadresForCard(cardName).map((cadre) => {
            const max = sectionCount(cadre);
            // Set : test d'appartenance en O(1) au lieu de includes() en O(n) par carte
            const ownedSet = new Set(cardState[cadre] || []);
            return (
              <div key={cadre} className="mb-4">
                <h3 className="text-sm font-semibold text-slate-300 mb-2">
                  {cadre} <span className="text-xs text-slate-500">({ownedSet.size}/{max})</span>
                </h3>
                <div className="flex flex-wrap gap-2">
                  {Array.from({ length: max }, (_, i) => i + 1).map((num) => {
                    const isOwned = ownedSet.has(num);
                    return (
                      <div key={num}
                        onClick={() => toggleVariant(cardName, cadre, num)}
                        title={`${cadre} #${num}${isOwned ? " — possédée (cliquer pour retirer)" : " — manquante (cliquer pour ajouter)"}`}
                        className={`w-11 h-[4.2rem] rounded-lg cursor-pointer relative overflow-hidden select-none transition-transform hover:scale-105 ${
                          isOwned ? "" : "opacity-60"
                        }`}
                        style={{
                          border: "2px solid",
                          borderColor: isOwned ? (CADRE_BORDER[cadre] || "#6366f1") : "#334155",
                          background: isOwned
                            ? "radial-gradient(circle at 50% 30%, rgba(99,102,241,0.35), rgba(15,23,42,0.9))"
                            : "#1e293b",
                          filter: isOwned ? "none" : "grayscale(1) brightness(0.6)"
                        }}>
                        <div className={`w-full h-full flex flex-col items-center justify-center gap-0.5 ${
                          isOwned ? "text-white" : "text-slate-500"
                        }`}>
                          <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                            isOwned ? "bg-indigo-600 text-white" : "bg-slate-700 text-slate-400"
                          }`}>{cardName[0].toUpperCase()}</div>
                          <span className={`text-base font-extrabold leading-none ${isOwned ? "text-cyan-300" : ""}`}
                            style={{ textShadow: "0 1px 3px rgba(0,0,0,0.8)" }}>#{num}</span>
                        </div>
                        {!isOwned && (
                          <div className="absolute top-0 right-0.5 text-lg font-extrabold text-slate-300/70"
                               style={{ textShadow: "0 1px 4px #000" }}>?</div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* ===== SECTIONS RARETÉ (SR, SSR, UR, ZEVENT…) ===== */}
          {/* Comme les sections de cadres : cartes cliquables. Stockées sous la
              clé "R:<rareté>" pour ne pas entrer en conflit avec les cadres

          {info.displayRarities.map((rr) => {

            const ownedSet = new Set(cardState[rKey] || []);
            return (
              <div key={rKey} className="mb-4">
                <h3 className="text-sm font-semibold text-slate-300 mb-2">
                  <span className={`px-1.5 py-0.5 mr-1 text-[10px] font-semibold rounded-full border border-white/10 ${RARITY_COLORS[rr] || "bg-slate-700 text-slate-200"}`}>{rr}</span>
                  Rareté <span className="text-xs text-slate-500">({ownedSet.size}/{max})</span>
                </h3>
                <div className="flex flex-wrap gap-2">
                  {Array.from({ length: max }, (_, i) => i + 1).map((num) => {
                    const isOwned = ownedSet.has(num);
                    return (
                      <div key={num}
                        onClick={() => toggleVariant(cardName, rKey, num)}
                        title={`${rr} #${num}${isOwned ? " — possédée (cliquer pour retirer)" : " — manquante (cliquer pour ajouter)"}`}
                        className={`w-11 h-[4.2rem] rounded-lg cursor-pointer relative overflow-hidden select-none transition-transform hover:scale-105 ${
                          isOwned ? "" : "opacity-60"
                        }`}
                        style={{
                          border: "2px solid",
                          borderColor: isOwned ? (RARITY_BORDER[rr] || "#6366f1") : "#334155",
                          background: isOwned
                            ? "radial-gradient(circle at 50% 30%, rgba(99,102,241,0.35), rgba(15,23,42,0.9))"

                        }}>
                        <div className={`w-full h-full flex flex-col items-center justify-center gap-0.5 ${

                          <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${

                          <span className={`text-base font-extrabold leading-none ${isOwned ? "text-cyan-300" : ""}`}

                        {!isOwned && (
                          <div className="absolute top-0 right-0.5 text-lg font-extrabold text-slate-300/70"
                               style={{ textShadow: "0 1px 4px #000" }}>?</div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6">
      <div className="max-w-7xl mx-auto">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
          <div>
            <h1 className="text-2xl font-bold text-white">VGacha — Collection Complète (Vue Cartes)</h1>
            <p className="text-sm text-slate-400">Clique sur un pseudo pour ouvrir sa collection en cartes, un tag pour le supprimer, ou "+" pour ajouter un numéro</p>
          </div>
          <div className="flex items-center gap-2">
            <input value={search} onChange={(e) => setSearch(e.target.value)}
              placeholder="Rechercher une carte…" className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm w-56"/>
            <button onClick={() => { setSearch(""); setRarityFilter(null); setSerieFilter(null); setShowOnlyOwned(false); setLimit(PAGE); }}
              className="text-xs px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700">Reset</button>
            <div className="relative">
              <button onClick={() => setMenuOpen(o => !o)} title="Menu progression"
                className="text-base leading-none px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700">&#9776;</button>
              {menuOpen && (
                <>
                  <div className="fixed inset-0 z-40" onClick={closeMenu}></div>
                  <div className="absolute right-0 mt-1 w-56 z-50 rounded-lg border border-slate-700 bg-slate-800 shadow-xl p-1 text-sm">
                    <button onClick={() => { exportProgress(); closeMenu(); }}
                      className="w-full text-left px-3 py-2 rounded hover:bg-slate-700">Exporter la progression</button>
                    <button onClick={() => { importRef.current && importRef.current.click(); closeMenu(); }}
                      className="w-full text-left px-3 py-2 rounded hover:bg-slate-700">Importer (fusion)</button>
                    {canLink && (
                      <button onClick={() => { linkFile(); closeMenu(); }}
                        className="w-full text-left px-3 py-2 rounded hover:bg-slate-700">
                        {linked ? "Fichier lié ✓ (changer)" : "Lier un fichier (auto-save)"}
                      </button>
                    )}
                  </div>
                </>
              )}
              <input ref={importRef} type="file" accept=".js,.json,application/json,text/javascript" onChange={importProgress} className="hidden"/>
            </div>
          </div>
        </div>
        {/* BARRE DE FILTRES : raretés (tags) + séries */}
        <div className="rounded-xl border border-slate-800 bg-slate-900/60 p-3 mb-4 space-y-2">
          {/* Rangée 1 : raretés (SR, SSR, UR, ZEVENT… = tags des cartes) */}
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-[10px] uppercase tracking-wide text-slate-500 w-14">Rareté</span>
            <button onClick={() => setRarityFilter(null)}
              className={`px-2.5 py-1 rounded-full text-xs font-medium border transition ${
                rarityFilter === null
                  ? "bg-slate-100 border-slate-100 text-slate-900"
                  : "bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700"
              }`}>Toutes</button>
            {rarityStats.map(({ key, owned, total }) => {
              const active = rarityFilter === key;
              return (
                <button key={key} onClick={() => setRarityFilter(active ? null : key)}
                  title={`Afficher uniquement les cartes avec le tag ${key}`}
                  className={`px-2.5 py-1 rounded-full text-xs font-medium border transition ${
                    active
                      ? "bg-indigo-600 border-indigo-500 text-white"
                      : "bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700"
                  }`}>
                  {key}
                  <span className={`ml-1 text-[10px] font-bold ${active ? "text-white/80" : "text-slate-500"}`}>
                    {owned}/{total}
                  </span>
                </button>
              );
            })}
          </div>
          {/* Rangée 2 : séries (VTA 2025, Eikyuu Hours…) */}
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-[10px] uppercase tracking-wide text-slate-500 w-14">Série</span>
            <button onClick={() => setSerieFilter(null)}
              className={`px-2.5 py-1 rounded-full text-xs font-medium border transition ${
                serieFilter === null
                  ? "bg-slate-100 border-slate-100 text-slate-900"
                  : "bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700"
              }`}>Toutes</button>
            {seriesStats.map(({ label, owned, total }) => {
              const active = serieFilter === label;
              return (
                <button key={label} onClick={() => setSerieFilter(active ? null : label)}
                  title={`Afficher uniquement les cartes de la série ${label}`}
                  className={`px-2.5 py-1 rounded-full text-xs font-medium border transition ${
                    active
                      ? "bg-indigo-600 border-indigo-500 text-white"
                      : "bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700"
                  }`}>
                  {label}
                  <span className={`ml-1 text-[10px] font-bold ${active ? "text-white/80" : "text-slate-500"}`}>
                    {owned}/{total}
                  </span>
                </button>
              );
            })}
            {/* Toggle : masquer les cartes sans aucune obtention */}
            <label className="ml-auto flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer select-none">
              <input type="checkbox" checked={showOnlyOwned}
                onChange={(e) => setShowOnlyOwned(e.target.checked)}
                className="accent-indigo-500 cursor-pointer"/>
              Masquer les cartes vierges
            </label>
          </div>
          {(rarityFilter || serieFilter) && (
            <p className="text-xs text-slate-400">
              Filtres actifs :{" "}
              {rarityFilter && <span className="text-indigo-300 font-semibold">{rarityFilter}</span>}
              {rarityFilter && serieFilter && " + "}
              {serieFilter && <span className="text-indigo-300 font-semibold">{serieFilter}</span>}
              {" "}(clique à nouveau sur un chip pour le retirer)
            </p>
          )}
        </div>

        <div className="mb-4 text-sm text-slate-400">
          <span className="text-emerald-400 font-semibold">{cards.reduce((count, card) => count + (ownedNames.has(card.name) ? 1 : 0), 0)}</span>
          {" "}/ {cards.length} cartes affichées avec variantes
          {" "}<span className="text-slate-500">— {ALL_CARDS.length} cartes au total dans la collection</span>
          {" "}<span className="text-slate-500">— <span className="text-cyan-300 font-semibold">{globalNumbers.owned}</span> / {globalNumbers.total} numéros de cartes au total</span>
        </div>

        {/* GRILLE DE CARTES */}
        {cards.length === 0 ? (
          <p className="text-slate-500 text-sm">Aucune carte trouvée pour « {search} ».</p>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
            {cards.slice(0, limit).map(c => (
              <Card key={c.name} r={c} own={state[c.name] || EMPTY}
                onAdd={onAdd} onRemove={onRemove} onOpen={onOpen} />
            ))}
            {cards.length > limit && (
              <div ref={setSentinel} className="col-span-full py-4 text-center text-xs text-slate-500">Chargement…</div>
            )}
          </div>
        )}

        <p className="text-xs text-slate-500 mt-4">
          <strong>Instructions:</strong><br/>
          - Clique sur un pseudo pour ouvrir sa vue Pokecardex (possédées en couleur, manquantes en grisé)<br/>
          - Sur chaque carte : "Basique 10/137" = numéros obtenus / total possibles pour ce cadre<br/>
          - Clique sur un tag pour le supprimer, sur + pour ajouter un numéro<br/>
          - Ta progression est sauvegardée automatiquement (même clé que l'ancienne version : tes données sont conservées)
        </p>
      </div>

      {renderPokecardex(pokedexCard)}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Collection />);
  </script>
</body>
</html>
